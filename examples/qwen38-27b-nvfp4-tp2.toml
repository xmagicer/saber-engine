# Saber manifest — the production configuration, as ONE resolved file.
#
# This is the replacement for the 137 `SABER_*` environment variables that Python and HIP each
# `getenv` independently and must agree on or weights read as garbage. Everything here is read
# once, hashed into the plan, and printed by `saber explain`:
#
#   saber explain examples/qwen38-27b-nvfp4-tp2.toml --prebuilt prebuilt/gfx1201
#
# Started from `saber_plan::reference::EXAMPLE_MANIFEST_TOML` and pointed at the artifacts this
# repo actually ships, so the plugin names match `prebuilt/gfx1201/*.manifest.toml` and the build
# hashes are the ones `saber-kbuild` wrote into them.
#
# The tier is production's default since 2026-09-15: unit `qwen_prod_nvfp4`, Qwen3.8-27B-NVFP4
# requantized NVFP4 -> MXFP4 at load onto the W4A8 kernel, 22.2 ms/step, GSM8K 97.60, TP=2.

[model]
path = "/mnt/nvme/models/Qwen3.8-27B-NVFP4"
tier_id = "tier:qwen38-27b-nvfp4-mxfp4-dflash2-v22.3"

[device]
target_gfx = "gfx1201"
# Required, and load-bearing: an autotune record measured uncapped is invalid at the enforced cap.
# Both cards are held at a FIXED 210 W policy with -75 mV; a MODE1 reset clears it silently.
power_cap_w = 210
tp = 2

# One entry per committed code object. `build_hash` is sha256(preprocessed source ++ flags) as
# recorded in prebuilt/gfx1201/<name>.manifest.toml, and it is part of every autotune key: a
# recompiled plugin invalidates its measurements rather than inheriting them.
#
# Five for the MXFP4 W4A8 GEMM family and its fused producers, one for the attention glue, nine
# for saber: paged attention,
# the fused GDN decode step, the conv + recurrent decode PAIR, the prefill trio (conv prep, KKT
# solve, chunk scan), the gated norm, and BOTH all-reduce families -- the WHT-quantised one above
# the 128 KiB threshold and the exact one below it, which prod runs every step.

[[plugins]]
# The attention layer's glue: qk_norm_rope, attn_gate_quant and the paged K/V append -- the
# three ops prod runs as Triton/ATen and Saber ran as nothing at all until workstream F's
# fourth plugin.
name = "attn_glue"
path = "prebuilt/gfx1201/attn_glue.hsaco"
build_hash = "1fb9de642a3c7480d7799748bb08537c98ffaf1bfe6b475b3b5c305ae7ea461f"

