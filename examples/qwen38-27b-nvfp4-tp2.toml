# The bucket set is load-bearing in both directions. Dropping capture sizes 1/2/4 cost 8% of
# single-stream decode, so the small buckets stay; and the total speculative GDN state a bucket
# touches must stay under the 64 MB Infinity Cache, which is why 8x5 is here and 8x6 is not
# (8:6 measured +2.2 ms/step, max_num_seqs=16 +5.5 ms/step, 2026-09-14).

[[buckets]]
batch = 1
spec_width = 5
ctx_band = 8192

[[buckets]]
batch = 2
spec_width = 5
ctx_band = 8192

[[buckets]]
batch = 4
spec_width = 5
ctx_band = 8192

[[buckets]]
batch = 8
spec_width = 5
ctx_band = 8192

# Prefill buckets: M = prompt tokens in a chunk, batch 1, no speculative width. A prefill bucket
# runs a DIFFERENT op set from a decode one -- the query-tiled attention kernel, the three-kernel
# GDN chunk path, the standalone gated norm -- and it carries ONE recurrent state per sequence
# rather than one per draft token, so it is nowhere near the Infinity-Cache bound that shapes the
# decode set above. 2048 is the smallest chunk above a_tiled_min_m (513) where the A-tiled family
# is the measured one; 8192 is --max-num-batched-tokens on the prod unit, the largest chunk the
# scheduler forms.

[[buckets]]
phase = "prefill"
tokens = 2048
ctx_band = 8192

[[buckets]]
phase = "prefill"
tokens = 8192
ctx_band = 8192

[plan]
capture = true
