## The fused post-AR epilogue. One instantiation: bf16 only, no template parameter.
## ws-h37: the `_ssqfma` derivation, not the saber-verbatim `_nq_bf16` (which stays in the code
## object). The fusion REPLACES the composition `exact reduce -> add_rms_quant`, and `add_rms_quant`
## is built with contraction on (prod's build line) while `saber_*` is `-ffp-contract=off`: the
## verbatim epilogue rounds `v * v` before the sum of squares and the producer does not, which is
## ws-h20's one e4m3 code in ~3.3M. `_ssqfma` writes that one line as an explicit fma (its ISA
## carries the producer's 14 fmac + 4 fma) and is gated bit-exact against the composition.
[[ar_exact_nq]]
