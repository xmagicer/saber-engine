# ---------------------------------------------------------------------------- workspaces
## Kinds, not byte counts. `IpcPeerVisible` is the one that cannot be expressed as "N bytes": the
## scratch and the flags are opened from the peer's IPC handle, and the per-block sequence counter
## -- which is allocated LOCALLY -- is protocol state whose value must stay in lockstep with the
## peer's, because slot = seq&1 chooses which half of the double-buffered scratch both ranks use.
## A replay that re-zeroed it, or a second Saber process that allocated its own, would desynchronise
## the two ranks and read the wrong slot. That is why it carries the peer-visible kind although
## `hipIpcGetMemHandle` is never called on it.

[workspace.attn_decode_scratch]
kind = "scratch"
# rows * splits * 520 B at the worst shape the engine can schedule; sized once at construction
# because allocating during a graph capture is not allowed and the address must survive replay.
# max_num_seqs 8 x q_len 10 x 12 q heads x 128 splits x 520 B.
capacity_bytes = 63897600

[workspace.attn_decode_counter]
kind = "persistent"
# ws-h38: one uint32 arrival counter per (sequence, kv head) item of the last-arriver decode
# attention. The last block to arrive resets its item's counter in place, so it is zeroed once at
# construction and graph replay needs no clearing pass (the decode GEMM's split-K `cnt` protocol).
# A fixed capacity rather than a per-bucket size: the Persistent region is keyed per (plugin, op)
# and must not change size between buckets. 256 items = max_num_seqs 64 x 4 kv heads (TP=1).
capacity_bytes = 1024

[workspace.gdn_fused_barrier]
kind = "persistent"
# ONE int32. The last workgroup to arrive resets it in place, so it is zeroed exactly once at
# construction and graph replay needs no clearing pass -- and a kind of `scratch` would be wrong
# even at four bytes, because an aliased buffer would hand the next launch someone else's count.
capacity_bytes = 4

[workspace.ar_scratch]
kind = "ipc_peer_visible"
# 2 slots x max_bytes, fine-grained (uncached) so a push posts straight to the fabric.
capacity_bytes = 176160768

[workspace.ar_flags]
kind = "ipc_peer_visible"
capacity_bytes = 2048              # max_blocks * 4

[workspace.ar_seq]
kind = "ipc_peer_visible"
capacity_bytes = 2048              # max_blocks * 4, local allocation, cross-rank protocol state

## The `_nq` epilogue's geometry: SABER_ARNQ_T threads, SABER_ARNQ_MAXG registers' worth of columns.
[ar_nq]
block = 256                        # SABER_ARNQ_T
max_k = 10240                      # 8 * SABER_ARNQ_T * SABER_ARNQ_MAXG: the register budget
k_multiple = 8                     # one int4 of bf16 per step

[workspace.ar_loc_pack]
kind = "scratch"
# This rank's packed half plus its fp32 scales, split at the same scale_off_bytes as the peer
# scratch: max_bytes/2 + max_bytes/32 + 4096. Local only -- but the reduce MUST fold exactly the
# bytes this rank sent, so it cannot be recomputed and it cannot be dropped.
capacity_bytes = 46903296
