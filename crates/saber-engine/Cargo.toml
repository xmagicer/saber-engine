[package]
name = "saber-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The seam this crate exists to close: `saber-sched` schedules, `saber-exec` launches, and until
# now nothing implemented the trait between them.
saber-sched = { path = "../saber-sched" }
saber-exec = { path = "../saber-exec" }
saber-vision-input = { path = "../saber-vision-input" }
saber-plan = { path = "../saber-plan" }
saber-model = { path = "../saber-model" }
saber-mem = { path = "../saber-mem" }
saber-hip = { path = "../saber-hip" }
saber-kernels = { path = "../saber-kernels" }
saber-serve = { path = "../saber-serve" }
# No `anyhow`: every error this crate produces is a `ForwardError` the step loop has to match on.
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The host gate drives the real scheduler and drains a real per-request event stream: the stream is
# tokio-backed (saber-sched owns the channel), so the tests need a runtime and a `StreamExt`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `tests/draft_inputs_gate.rs` reads the proposal captures' JSON manifests. The tensors are flat
# uint8 `.npy` and the test parses those itself; only the manifest needs a JSON reader.
# `tests/census_parity.rs` (ws-v8) scrapes `/metrics` over a real socket from the real router.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = { version = "0.8", features = ["tokio", "http1"] }
